<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32x32.png">
<title>POLAR · Marker rating by cluster</title>
<script>
  /* Google Apps Script web-app URL (see tools/apps-script/marqueurs-clusters.gs). */
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzyyD5b6SzqnD3-EugngCjkOJjcvTD8LIenEgLZk48gIXbo7qTNE6M6ieJWjntzDTQ9lw/exec";
</script>
</body>
</html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar (view tabs, EN/FR switch, save status) → instructions → one section per cluster, one rating row per marker; a results view with a scatter (polemicity × operationality) and a sortable table */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1b2230; --muted:#5d6676; --line:#dde1e8; --soft:#eef0f4;
  --accent:#3b3fb6; --accent-ink:#ffffff;
  --fr:#2f5fb3; --en:#b2453a; --el:#1f8a7a; --warn:#a86a00; --warnbg:#fff4de; --ok:#2d7a3e;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Fira Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"Fira Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3240; --soft:#222733;
  --accent:#9ea2ff; --accent-ink:#12151c; --fr:#7ea6f0; --en:#ef8a7e; --el:#5fcbb8; --warn:#f0b54a; --warnbg:#2e2614; --ok:#6fcf86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3240; --soft:#222733;
  --accent:#9ea2ff; --accent-ink:#12151c; --fr:#7ea6f0; --en:#ef8a7e; --el:#5fcbb8; --warn:#f0b54a; --warnbg:#2e2614; --ok:#6fcf86; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:650;margin:0;text-wrap:balance}
h1{font-size:1.25rem}
h2{font-size:1.1rem;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{background:none;border:0;padding:5px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.status.saved i,.status.ready i{background:var(--ok)}
.status.saving i{background:var(--warn)}
.status.error i,.status.ro i,.status.nodb i{background:var(--en)}
.progress{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

main{padding-block:22px 64px}
main .inner{display:flex;flex-direction:column;gap:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.consigne{display:flex;flex-direction:column;gap:10px;max-width:none}
.consigne p{max-width:78ch}
.consigne .scales{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.consigne .scale{border-left:3px solid var(--accent);padding-left:12px;min-width:0}
.consigne .scale b{display:block;font-weight:600}
.notice{font-size:.85rem;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.85rem;color:var(--muted)}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.chipset button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.8rem}
.chipset button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.filters label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.jump{display:flex;flex-wrap:wrap;gap:4px}
.jump a{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.jump a:hover{color:var(--ink)}

/* cluster sections */
.cl{display:flex;flex-direction:column;gap:8px;scroll-margin-top:90px}
.cl h2{display:flex;gap:10px;align-items:baseline}
.cid{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:400}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mk{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(0,2fr);gap:10px 20px;padding:12px 16px;border-top:1px solid var(--line);scroll-margin-top:90px}
.mk:first-child{border-top:0}
.mk.flash{background:var(--soft)}
@media (max-width:760px){.mk{grid-template-columns:1fr}}
.expr{display:flex;flex-direction:column;gap:4px;min-width:0}
.expr .tx{font-weight:500;font-size:1rem;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;align-items:center}
.lg{font-family:var(--mono);font-size:.68rem;padding:1px 5px;border-radius:4px;color:var(--accent-ink)}
.lg.FR{background:var(--fr)} .lg.EN{background:var(--en)} .lg.EL{background:var(--el)}
.st{font-size:.72rem;color:var(--muted)}
.dims{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{display:grid;grid-template-columns:120px auto 1fr;gap:6px 12px;align-items:center}
@media (max-width:520px){.dim{grid-template-columns:1fr}}
.dl{font-size:.82rem;color:var(--muted)}
.seg{display:flex;gap:3px}
.seg button{width:32px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.seg button:hover:not(:disabled){border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.q{margin-left:6px}
.seg button.q[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.agg{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.hist{display:flex;align-items:flex-end;gap:2px;height:18px}
.hist span{width:6px;background:var(--accent);opacity:.75;border-radius:1px;min-height:1px}
.hist span.z{background:var(--line);opacity:1}
.agg b{color:var(--ink);font-weight:500}
.cm input{width:100%;font:inherit;font-size:.85rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.cm input:disabled{opacity:.6}
details.who{font-size:.82rem}
details.who summary{cursor:pointer;color:var(--muted)}
.wl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.wr{display:grid;grid-template-columns:minmax(90px,160px) 110px 1fr;gap:8px;align-items:baseline}
@media (max-width:520px){.wr{grid-template-columns:1fr}}
.wr .nm{font-weight:500;overflow-wrap:anywhere}
.wr .sc{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wr .co{color:var(--muted);overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic}

/* results */
.res-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.plot-wrap{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
svg .axis{stroke:var(--line)}
svg .grid{stroke:var(--line);stroke-dasharray:2 3}
svg circle{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
svg circle:hover,svg circle:focus{stroke:var(--ink);stroke-width:2;outline:none}
.cap{font-size:.85rem;color:var(--muted);min-height:1.5em}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.85rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--muted);font-size:.78rem;background:var(--soft);cursor:pointer;user-select:none;white-space:nowrap}
th[aria-sort]{color:var(--accent)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--soft)}
.note{font-size:.8rem;color:var(--muted)}
.namecard{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.namecard label{font-weight:500}
.namecard input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px;max-width:340px}
.btn{font:inherit;font-size:.9rem;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.namecard .hint{flex-basis:100%;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>

<header class="top pad">
  <div class="inner">
    <div class="brand">
      <span class="eyebrow">POLAR · FR / EN / EL</span>
      <h1 id="t-title"></h1>
    </div>
    <div class="tabs" role="group" aria-label="View">
      <button type="button" id="v-vote" aria-pressed="true"></button>
      <button type="button" id="v-res" aria-pressed="false"></button>
    </div>
    <span class="progress" id="progress"></span>
    <span class="status" id="status"><i></i><span></span></span>
    <div class="tabs" role="group" aria-label="Language">
      <button type="button" data-uilang="en" aria-pressed="false">EN</button>
      <button type="button" data-uilang="fr" aria-pressed="false">FR</button>
    </div>
  </div>
</header>

<main class="pad">
  <div class="inner">
    <section class="box consigne" id="consigne"></section>
    <section class="box namecard" id="namecard">
      <label for="voter-name" id="t-name"></label>
      <input type="text" id="voter-name" autocomplete="name" maxlength="80">
      <button type="button" class="btn" id="name-ok"></button>
      <span class="hint" id="t-namehint"></span>
    </section>
    <div id="notice" class="notice" hidden></div>

    <div id="view-vote" style="display:flex;flex-direction:column;gap:22px">
      <div class="filters">
        <span id="t-flang"></span>
        <div class="chipset" id="flang"></div>
        <label><input type="checkbox" id="funrated"> <span id="t-funrated"></span></label>
      </div>
      <nav class="jump" id="jump" aria-label="Clusters"></nav>
      <div id="clusters" style="display:flex;flex-direction:column;gap:22px"></div>
    </div>

    <div id="view-res" hidden>
      <div class="res-grid">
        <section class="box" style="display:flex;flex-direction:column;gap:10px">
          <h2 id="t-plot"></h2>
          <p class="note" id="t-plotnote"></p>
          <div class="legend"><span><i class="lg FR">FR</i></span><span><i class="lg EN">EN</i></span><span><i class="lg EL">EL</i></span></div>
          <div class="plot-wrap"><svg id="plot" viewBox="0 0 620 440" width="620" height="440" role="img"></svg></div>
          <p class="cap" id="cap"></p>
        </section>
        <section class="box" style="display:flex;flex-direction:column;gap:10px">
          <h2 id="t-table"></h2>
          <div class="tbl"><table id="rtable"></table></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script>
/* ---------- content ---------- */
const CL = [
 {id:"C01", en:"Anticipated or presupposed gratitude", fr:"Gratitude anticipée ou présupposée",
  mk:[["FR","Ne me remercie(z) pas","m"],["EN","Thank me later","m"],["EL","Τίποτα","m"],["EN","Don't thank me","a"],["EN","No need to thank me","a"],["EL","Παρακαλώ","a"],["EL","Μη με ευχαριστάς","a"],["EL","Τίποτα, μην το συζητάς","a"]]},
 {id:"C02", en:"Framing a question as information-seeking", fr:"Présenter une question comme une demande d'information",
  mk:[["FR","Je demande, c'est pour X","m"],["FR","Je demande juste","m"],["EN","Genuine question","m"],["EN","Just asking (for a friend)","m"],["EL","Ρωτάω έτσι","m"],["EL","Απλά ρωτάω","m"]]},
 {id:"C03", en:"Feigned incomprehension", fr:"Incompréhension feinte",
  mk:[["EN","I'm confused","m"],["EL","Εγώ απλά δεν κατανοώ","m"],["FR","Attends","a"],["EL","Απλά δεν το καταλαβαίνω","a"]]},
 {id:"C04", en:"Feigned causal ignorance", fr:"Ignorance causale feinte",
  mk:[["EN","Wondering why / Wonder why...","m"],["EL","γιατί άραγε;","m"],["FR","Après, on se demande pourquoi...","m"],["EN","go figure","a"],["EN","what do you know","a"],["EN","and then they are surprised","a"],["FR","comme par hasard","a"],["EL","Και μετά αναρωτιέται","a"],["EL","έτσι τυχαία","a"]]},
 {id:"C05", en:"Revealing reformulation of another's discourse", fr:"Reformulation « révélatrice » du discours d'autrui",
  mk:[["FR","Traduction :","m"],["EN","Translation:","m"]]},
 {id:"C06", en:"Metadiscursive distancing after taking a position", fr:"Distanciation métadiscursive après une prise de position",
  mk:[["FR","Je dis ça, je dis rien","m"],["EN","Just saying","m"],["EL","Λέω γω τώρα","m"],["EL","απλά λέω","m"]]},
 {id:"C07", en:"Dismissive responses to an interlocutor's position", fr:"Réponses de rejet face à la position de l'interlocuteur",
  mk:[["EN","Nah","m"],["EL","Μπα","m"],["FR","nan mais","a"]]},
 {id:"C08", en:"Challenging an interlocutor's position through questioning", fr:"Contester la position de l'interlocuteur par le questionnement",
  mk:[["EN","So you suggest that...?","m"],["EN","So you think that?","m"],["EL","θέλεις να μας πεις...?","m"],["FR","Tu proposes quoi ?","a"],["FR","C'est ça ton idée ?","a"]]},
 {id:"C09", en:"Rhetorical questions challenging competence or credibility", fr:"Questions rhétoriques mettant en cause la compétence ou la crédibilité",
  mk:[["FR","Vous savez lire ?","m"],["EN","Does anyone really believe that...?","m"],["EN","Really?","m"],["EL","Μπορεί κάποιος να είναι...?","m"],["EL","μήπως λες βλακείες;","m"],["FR","Vous y croyez vraiment ?","a"],["FR","Va t'acheter des lunettes","a"]]},
 {id:"C10", en:"Metadiscursive framing of a personal opinion", fr:"Cadrage métadiscursif d'une opinion personnelle",
  mk:[["EN","[My] unpopular opinion","m"],["EL","Ταπεινή μου γνώμη","m"],["FR","PDV (point de vue)","a"]]},
 {id:"C11", en:"Ironic assent and expressed disbelief", fr:"Assentiment ironique et incrédulité exprimée",
  mk:[["EN","Yeah right!","p"],["FR","Ben voyons !","p"],["EL","Ναι καλά!","p"]]},
 {id:"C12", en:"Ostensible apology and explicit retraction", fr:"Excuse ostensible et rétractation explicite",
  mk:[["EN","Sorry not sorry","p"],["FR","Déso pas déso","p"]]},
 {id:"C13", en:"Appeal to shared knowledge or obviousness", fr:"Appel au savoir partagé ou à l'évidence",
  mk:[["FR","Tout le monde sait","p"],["EN","It's obvious [who/that]...","p"],["EN","We all know","p"],["EL","Όλοι ξέρουν","p"],["EL","Ξέρουμε","p"]]},
 {id:"C14", en:"Invoking another discourse to contest it", fr:"Convoquer le discours d'autrui pour le contester",
  mk:[["EN","And they say...","p"],["EL","Και μετά λέτε...","p"]]}
];
const MARKERS = [];
CL.forEach(c => c.mk.forEach((m,i) => MARKERS.push({id:c.id+"-"+i, cl:c, lang:m[0], tx:m[1], st:m[2]})));
const MBYID = Object.fromEntries(MARKERS.map(m=>[m.id,m]));

const T = {
 en:{title:"Marker rating", vote:"Rate", res:"Results",
  consTitle:"Instructions",
  cons:"Rate each marker on two independent scales from 1 to 5. Choose “?” if you cannot judge, and add a comment if it helps. Your ratings save automatically and the whole team sees them, with your name. Click a selected value again to clear it.",
  polT:"Degree of polemicity", polD:"How strongly is the form associated with polemical exchanges (disagreement, confrontation, disqualifying the other)? 1 = weakly, 5 = strongly.",
  opT:"Degree of operationality", opD:"How usable is the form as a search query on Twitter/X? Consider noise, frequency, ambiguity and spelling variants. 1 = unusable (mostly irrelevant hits), 5 = highly usable (mostly relevant hits).",
  slot:"For forms with a slot (X, ..., [who/that]), rate the construction as a whole.",
  pol:"Polemicity", op:"Operationality", hard:"Hard to judge", comment:"Comment (optional)",
  m:"main expression", a:"additional candidate", p:"proposed (new cluster)",
  votes:"Votes", noVotes:"No votes yet", you:"you", someone:"Someone",
  flang:"Language:", all:"All", funrated:"Only markers I haven't fully rated",
  prog:(x,n)=>`${x}/${n} rated`,
  s:{connecting:"Connecting…", ready:"Saves automatically", saving:"Saving…", saved:"Saved", error:"Not saved yet, kept in this browser", ro:"Enter your name", nodb:"Voting not configured"},
  name:"Your name", nameOk:"Start", nameChange:"Change name",
  nameHint:"Your name is shown next to your ratings. Use the same browser each time so your ratings stay together.",
  nNoName:"Enter your name above to start rating.",
  nNoEndpoint:"Voting is not configured yet (no server address). You can read the markers, but ratings cannot be saved.",
  nOffline:"Could not reach the server. Your ratings are kept in this browser and will be sent on the next change or reload.",
  plot:"Polemicity × operationality", plotNote:"Mean ratings per marker; “?” answers are excluded from means. Click a point to open that marker.",
  table:"All markers", thCl:"Cluster", thEx:"Marker", thLg:"Lang", thPol:"Polemicity", thOp:"Operationality", thN:"Raters", thC:"Comments",
  axX:"Polemicity (mean)", axY:"Operationality (mean)", meanOf:(m,n,q)=>`mean ${m} · n=${n}${q?` · ?×${q}`:""}`},
 fr:{title:"Évaluation des marqueurs", vote:"Évaluer", res:"Résultats",
  consTitle:"Consigne",
  cons:"Évaluez chaque marqueur sur deux échelles indépendantes, de 1 à 5. Choisissez « ? » si vous ne pouvez pas trancher, et ajoutez un commentaire si besoin. Vos réponses sont enregistrées automatiquement et visibles par toute l'équipe, avec votre nom. Cliquez à nouveau sur une valeur sélectionnée pour l'effacer.",
  polT:"Degré de polémicité", polD:"Dans quelle mesure la forme est-elle associée à des échanges polémiques (désaccord, confrontation, disqualification de l'autre) ? 1 = faiblement, 5 = fortement.",
  opT:"Degré d'opérationnalité", opD:"Dans quelle mesure la forme est-elle exploitable comme requête sur Twitter/X ? Tenez compte du bruit, de la fréquence, de l'ambiguïté et des variantes graphiques. 1 = inexploitable (surtout des occurrences non pertinentes), 5 = très exploitable (surtout des occurrences pertinentes).",
  slot:"Pour les formes à compléter (X, ..., [who/that]), évaluez la construction dans son ensemble.",
  pol:"Polémicité", op:"Opérationnalité", hard:"Difficile à juger", comment:"Commentaire (facultatif)",
  m:"expression principale", a:"candidat supplémentaire", p:"proposée (nouveau cluster)",
  votes:"Votes", noVotes:"Aucun vote pour l'instant", you:"vous", someone:"Quelqu'un",
  flang:"Langue :", all:"Toutes", funrated:"Seulement les marqueurs que je n'ai pas fini d'évaluer",
  prog:(x,n)=>`${x}/${n} évalués`,
  s:{connecting:"Connexion…", ready:"Enregistrement automatique", saving:"Enregistrement…", saved:"Enregistré", error:"Pas encore envoyé, conservé dans ce navigateur", ro:"Indiquez votre nom", nodb:"Vote non configuré"},
  name:"Votre nom", nameOk:"Commencer", nameChange:"Changer de nom",
  nameHint:"Votre nom s'affiche à côté de vos évaluations. Utilisez toujours le même navigateur pour que vos réponses restent regroupées.",
  nNoName:"Indiquez votre nom ci-dessus pour commencer.",
  nNoEndpoint:"Le vote n'est pas encore configuré (pas d'adresse serveur). Vous pouvez consulter les marqueurs, mais les évaluations ne peuvent pas être enregistrées.",
  nOffline:"Serveur injoignable. Vos évaluations sont conservées dans ce navigateur et seront envoyées à la prochaine modification ou au prochain chargement.",
  plot:"Polémicité × opérationnalité", plotNote:"Moyennes par marqueur ; les réponses « ? » sont exclues des moyennes. Cliquez sur un point pour ouvrir le marqueur.",
  table:"Tous les marqueurs", thCl:"Cluster", thEx:"Marqueur", thLg:"Langue", thPol:"Polémicité", thOp:"Opérationnalité", thN:"Évaluateurs", thC:"Commentaires",
  axX:"Polémicité (moyenne)", axY:"Opérationnalité (moyenne)", meanOf:(m,n,q)=>`moy. ${m} · n=${n}${q?` · ?×${q}`:""}`}
};

/* ---------- state ---------- */
let lang = "en";
try { const s = localStorage.getItem("polar-vote-lang"); if (s==="fr"||s==="en") lang = s; } catch(e){}
let mine = {};          // markerId -> {pol, op, c}
let all = {};           // uid -> ratings map
let me = null, myName = "";
let canVote = false, touched = false, gotMine = false;
let names = {};         // voter id -> display name (from the server rows)
const ID_KEY = "polar-mc-voter", BACKUP_KEY = "polar-mc-backup";
let statusKey = "connecting";
let noticeKey = null;
let langFilter = "all", onlyUnrated = false;
let sortKey = "pol", sortDir = "desc";

const $ = s => document.querySelector(s);
const t = () => T[lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- static render ---------- */
function buildClusters(){
  $("#jump").innerHTML = CL.map(c=>`<a href="#sec-${c.id}" data-jump="${c.id}">${c.id}</a>`).join("");
  $("#clusters").innerHTML = CL.map(c => `
    <section class="cl" id="sec-${c.id}">
      <h2><span class="cid">${c.id}</span><span class="cn" data-cl="${c.id}"></span></h2>
      <div class="rows">${MARKERS.filter(m=>m.cl===c).map(rowHtml).join("")}</div>
    </section>`).join("");
}
function segHtml(m,d){
  let h = "";
  for (let v=1; v<=5; v++) h += `<button type="button" data-m="${m.id}" data-d="${d}" data-v="${v}" aria-pressed="false">${v}</button>`;
  h += `<button type="button" class="q" data-m="${m.id}" data-d="${d}" data-v="?" aria-pressed="false" data-title="hard">?</button>`;
  return h;
}
function rowHtml(m){
  return `<div class="mk" id="mk-${m.id}" data-m="${m.id}" data-lang="${m.lang}">
    <div class="expr">
      <span class="tags"><i class="lg ${m.lang}">${m.lang}</i><span class="st" data-st="${m.st}"></span></span>
      <span class="tx">${esc(m.tx)}</span>
    </div>
    <div class="dims">
      <div class="dim"><span class="dl" data-k="pol"></span><div class="seg" role="group">${segHtml(m,"pol")}</div><div class="agg" id="ag-pol-${m.id}"></div></div>
      <div class="dim"><span class="dl" data-k="op"></span><div class="seg" role="group">${segHtml(m,"op")}</div><div class="agg" id="ag-op-${m.id}"></div></div>
      <div class="cm"><input type="text" id="cm-${m.id}" data-m="${m.id}" maxlength="500" autocomplete="off"></div>
      <details class="who" id="who-${m.id}"><summary></summary><div class="wl"></div></details>
    </div>
  </div>`;
}

/* ---------- language ---------- */
function applyLang(){
  const L = t();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-uilang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.uilang===lang)));
  $("#t-title").textContent = L.title;
  $("#v-vote").textContent = L.vote; $("#v-res").textContent = L.res;
  $("#consigne").innerHTML = `<h2>${esc(L.consTitle)}</h2><p>${esc(L.cons)}</p>
    <div class="scales"><div class="scale"><b>${esc(L.polT)}</b>${esc(L.polD)}</div><div class="scale"><b>${esc(L.opT)}</b>${esc(L.opD)}</div></div>
    <p class="note">${esc(L.slot)}</p>`;
  document.querySelectorAll(".cn").forEach(el => { const c = CL.find(x=>x.id===el.dataset.cl); el.textContent = c[lang]; });
  document.querySelectorAll(".st").forEach(el => el.textContent = L[el.dataset.st]);
  document.querySelectorAll(".dl").forEach(el => el.textContent = L[el.dataset.k]);
  document.querySelectorAll("button.q").forEach(b => { b.title = L.hard; b.setAttribute("aria-label", L.hard); });
  document.querySelectorAll(".cm input").forEach(i => i.placeholder = L.comment);
  $("#t-flang").textContent = L.flang; $("#t-funrated").textContent = L.funrated;
  $("#flang").innerHTML = ["all","FR","EN","EL"].map(k=>`<button type="button" data-f="${k}" aria-pressed="${langFilter===k}">${k==="all"?esc(L.all):k}</button>`).join("");
  $("#t-plot").textContent = L.plot; $("#t-plotnote").textContent = L.plotNote; $("#t-table").textContent = L.table;
  $("#t-name").textContent = L.name; $("#voter-name").placeholder = lang==="fr" ? "Prénom Nom" : "First name Last name";
  $("#name-ok").textContent = myName ? L.nameChange : L.nameOk; $("#t-namehint").textContent = L.nameHint;
  setStatus(statusKey); setNotice(noticeKey);
  refresh();
}

/* ---------- status ---------- */
function setStatus(k){ statusKey = k; const el = $("#status"); el.className = "status "+k; el.lastElementChild.textContent = t().s[k] || ""; }
function setNotice(k){ noticeKey = k; const el = $("#notice"); if(!k){ el.hidden = true; return; } el.textContent = t()[k]; el.hidden = false; }
function setEnabled(on){
  canVote = on;
  document.querySelectorAll(".seg button, .cm input").forEach(el => el.disabled = !on);
}

/* ---------- aggregation ---------- */
function ratingsFor(mid){
  const out = [];
  const ids = new Set(Object.keys(all)); if (me) ids.add(me);
  ids.forEach(uid => {
    const r = (uid===me ? mine : all[uid]) || {};
    const x = r[mid];
    if (x && (x.pol!=null || x.op!=null || (x.c && x.c.trim()))) out.push({uid, ...x});
  });
  return out;
}
function stat(list, d){
  const nums = list.map(r=>r[d]).filter(v=>typeof v==="number");
  const q = list.filter(r=>r[d]==="?").length;
  const hist = [0,0,0,0,0]; nums.forEach(v=>hist[v-1]++);
  const mean = nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null;
  return {mean, n:nums.length, q, hist};
}
function aggHtml(s){
  const mx = Math.max(1, ...s.hist);
  const bars = s.hist.map((c,i)=>`<span class="${c?"":"z"}" style="height:${c? Math.max(3, c/mx*18):2}px" title="${i+1}: ${c}"></span>`).join("");
  if (!s.n && !s.q) return `<span class="hist">${bars}</span><span>—</span>`;
  return `<span class="hist" aria-hidden="true">${bars}</span><span><b>${s.mean!=null?s.mean.toFixed(1):"–"}</b> n=${s.n}${s.q?` · ?×${s.q}`:""}</span>`;
}
function fmt(v){ return v==="?" ? "?" : (v==null ? "–" : String(v)); }

/* ---------- live render ---------- */
async function refresh(){
  const L = t();
  let done = 0;
  MARKERS.forEach(m => {
    const my = mine[m.id] || {};
    if (my.pol!=null && my.op!=null) done++;
    document.querySelectorAll(`.seg button[data-m="${m.id}"]`).forEach(b => {
      const v = b.dataset.v==="?" ? "?" : Number(b.dataset.v);
      b.setAttribute("aria-pressed", String(my[b.dataset.d]===v));
    });
    const inp = document.getElementById("cm-"+m.id);
    if (inp && document.activeElement!==inp && inp.value !== (my.c||"")) inp.value = my.c||"";
    const list = ratingsFor(m.id);
    document.getElementById("ag-pol-"+m.id).innerHTML = aggHtml(stat(list,"pol"));
    document.getElementById("ag-op-"+m.id).innerHTML = aggHtml(stat(list,"op"));
    const who = document.getElementById("who-"+m.id);
    who.querySelector("summary").textContent = `${L.votes} (${list.length})`;
    const wl = who.querySelector(".wl"); wl.textContent = "";
    if (!list.length){ const e = document.createElement("span"); e.className="empty"; e.textContent = L.noVotes; wl.append(e); }
    list.sort((a,b)=> (a.uid===me?-1:b.uid===me?1:0)).forEach(r => {
      const row = document.createElement("div"); row.className = "wr";
      const nm = document.createElement("span"); nm.className="nm";
      nm.textContent = r.uid===me ? (myName ? myName+" ("+L.you+")" : L.you) : (names[r.uid] || L.someone);
      const sc = document.createElement("span"); sc.className="sc"; sc.textContent = `P ${fmt(r.pol)} · O ${fmt(r.op)}`;
      const co = document.createElement("span"); co.className="co"; co.textContent = r.c || "";
      row.append(nm, sc, co); wl.append(row);
    });
  });
  $("#progress").textContent = L.prog(done, MARKERS.length);
  applyFilters();
  if (!$("#view-res").hidden) renderResults();
}

function applyFilters(){
  MARKERS.forEach(m => {
    const my = mine[m.id] || {};
    const hide = (langFilter!=="all" && m.lang!==langFilter) || (onlyUnrated && my.pol!=null && my.op!=null);
    document.getElementById("mk-"+m.id).hidden = hide;
  });
  CL.forEach(c => {
    const any = MARKERS.some(m => m.cl===c && !document.getElementById("mk-"+m.id).hidden);
    document.getElementById("sec-"+c.id).hidden = !any;
  });
}

/* ---------- results ---------- */
function rows(){
  return MARKERS.map(m => {
    const list = ratingsFor(m.id);
    return {m, pol:stat(list,"pol"), op:stat(list,"op"), raters:list.length, comments:list.filter(r=>r.c&&r.c.trim()).length};
  });
}
function renderResults(){
  const L = t(), R = rows();
  // scatter
  const W=620,H=440,ml=56,mr=20,mt=16,mb=48;
  const x = v => ml + (v-1)/4*(W-ml-mr), y = v => H-mb - (v-1)/4*(H-mt-mb);
  let s = "";
  for (let v=1; v<=5; v++){
    s += `<line class="grid" x1="${x(v)}" y1="${mt}" x2="${x(v)}" y2="${H-mb}"/><line class="grid" x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}"/>`;
    s += `<text x="${x(v)}" y="${H-mb+18}" text-anchor="middle">${v}</text><text x="${ml-10}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  }
  s += `<line class="axis" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/><line class="axis" x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}"/>`;
  s += `<text x="${(ml+W-mr)/2}" y="${H-10}" text-anchor="middle">${esc(L.axX)}</text>`;
  s += `<text transform="translate(16 ${(mt+H-mb)/2}) rotate(-90)" text-anchor="middle">${esc(L.axY)}</text>`;
  const col = {FR:"var(--fr)",EN:"var(--en)",EL:"var(--el)"};
  R.filter(r=>r.pol.mean!=null && r.op.mean!=null).forEach(r => {
    s += `<circle tabindex="0" data-m="${r.m.id}" cx="${x(r.pol.mean).toFixed(1)}" cy="${y(r.op.mean).toFixed(1)}" r="${5+Math.min(r.raters,8)*0.6}" fill="${col[r.m.lang]}" fill-opacity="0.85"><title>${esc(r.m.id+" · "+r.m.tx)}</title></circle>`;
  });
  $("#plot").innerHTML = s;
  $("#plot").setAttribute("aria-label", L.plot);
  // table
  const key = r => sortKey==="pol" ? (r.pol.mean ?? -1) : sortKey==="op" ? (r.op.mean ?? -1) : sortKey==="n" ? r.raters : sortKey==="cl" ? r.m.id : sortKey==="lg" ? r.m.lang : r.m.tx.toLowerCase();
  R.sort((a,b)=>{ const A=key(a),B=key(b); const c = A<B?-1:A>B?1:0; return sortDir==="asc"?c:-c; });
  const th = (k,lbl) => `<th data-sort="${k}"${sortKey===k?` aria-sort="${sortDir==="asc"?"ascending":"descending"}"`:""}>${esc(lbl)}${sortKey===k?(sortDir==="asc"?" ↑":" ↓"):""}</th>`;
  const cell = st => st.n||st.q ? `${st.mean!=null?st.mean.toFixed(2):"–"} <span class="note">n=${st.n}${st.q?` ?×${st.q}`:""}</span>` : "–";
  $("#rtable").innerHTML = `<thead><tr>${th("cl",L.thCl)}${th("tx",L.thEx)}${th("lg",L.thLg)}${th("pol",L.thPol)}${th("op",L.thOp)}${th("n",L.thN)}<th>${esc(L.thC)}</th></tr></thead><tbody>` +
    R.map(r=>`<tr class="clk" data-m="${r.m.id}"><td class="n">${r.m.cl.id}</td><td>${esc(r.m.tx)}</td><td><i class="lg ${r.m.lang}">${r.m.lang}</i></td><td class="n">${cell(r.pol)}</td><td class="n">${cell(r.op)}</td><td class="n">${r.raters}</td><td class="n">${r.comments||""}</td></tr>`).join("") + `</tbody>`;
}
function openMarker(mid){
  showView("vote");
  langFilter = "all"; onlyUnrated = false; $("#funrated").checked = false;
  document.querySelectorAll("#flang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.f==="all")));
  applyFilters();
  const el = document.getElementById("mk-"+mid); if(!el) return;
  el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1600);
  const w = document.getElementById("who-"+mid); if (w) w.open = true;
}
function showView(v){
  $("#view-vote").hidden = v!=="vote"; $("#view-res").hidden = v!=="res";
  $("#v-vote").setAttribute("aria-pressed", String(v==="vote")); $("#v-res").setAttribute("aria-pressed", String(v==="res"));
  if (v==="res") renderResults();
}

/* ---------- saving (Google Apps Script) ---------- */
let saveTimer = null, saving = false, dirty = false, retried = false;
function backup(){ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify({voter:me, mine, pending:true})); }catch(e){} }
function clearBackup(){ try{ localStorage.removeItem(BACKUP_KEY); }catch(e){} }
function schedule(delay){
  dirty = true; touched = true; retried = false; setStatus("saving"); backup();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, delay);
}
function clean(){
  const out = {};
  Object.entries(mine).forEach(([k,v]) => {
    const e = {};
    if (v.pol!=null) e.pol = v.pol;
    if (v.op!=null) e.op = v.op;
    if (v.c && v.c.trim()) e.c = v.c.trim().slice(0,500);
    if (Object.keys(e).length) out[k] = e;
  });
  return out;
}
async function flush(){
  if (!ENDPOINT || !me || !myName || !canVote || saving || !dirty) return;
  saving = true; dirty = false;
  const ratings = Object.entries(clean()).filter(([m]) => MBYID[m]).map(([m,v]) => ({
    m, cluster: MBYID[m].cl.id, lang: MBYID[m].lang, marker: MBYID[m].tx,
    pol: v.pol==null ? null : v.pol, op: v.op==null ? null : v.op, c: v.c || ""}));
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 45000);
    let j;
    try {
      const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({voter: me, name: myName, ratings}), signal: ctrl.signal});
      j = await r.json();
    } finally { clearTimeout(to); }
    if (!j || !j.ok) throw new Error((j && j.error) || "server");
  } catch(e) {
    dirty = true; saving = false;
    setStatus("error"); setNotice("nOffline");
    if (!retried){ retried = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 4000 + Math.random()*2000); }
    return;
  }
  saving = false;
  if (dirty){ flush(); return; }
  clearBackup();
  if (noticeKey==="nOffline") setNotice(null);
  setStatus("saved");
}

/* ---------- loading results ---------- */
let pulling = false;
async function pull(){
  if (!ENDPOINT || pulling) return;
  pulling = true;
  try {
    const r = await fetch(ENDPOINT + (ENDPOINT.includes("?") ? "&" : "?") + "t=" + Date.now());
    const j = await r.json();
    if (!j || !j.ok || !Array.isArray(j.rows)) throw new Error("bad response");
    const next = {}, nm = {};
    j.rows.forEach(x => {
      if (!x || !x.voter || !x.m) return;
      (next[x.voter] || (next[x.voter] = {}))[x.m] = {pol: x.pol, op: x.op, c: x.c || ""};
      if (x.name) nm[x.voter] = x.name;
    });
    all = next; names = nm;
    if (me && !gotMine && !touched){ mine = JSON.parse(JSON.stringify(next[me] || {})); gotMine = true; }
    if (statusKey==="connecting") setStatus(canVote ? "ready" : "ro");
    refresh();
  } catch(e) {
    if (statusKey==="connecting") setStatus("error");
  } finally { pulling = false; }
}

/* ---------- identity (name typed by the voter, id kept in this browser) ---------- */
function newId(){
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return "v" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function loadIdentity(){
  try { const s = JSON.parse(localStorage.getItem(ID_KEY) || "null"); if (s && s.id){ me = s.id; myName = s.name || ""; } } catch(e){}
  if (!me) me = newId();
}
function saveIdentity(){ try { localStorage.setItem(ID_KEY, JSON.stringify({id: me, name: myName})); } catch(e){} }
function submitName(){
  const v = $("#voter-name").value.trim().slice(0, 80);
  if (!v){ setNotice("nNoName"); $("#voter-name").focus(); return; }
  const changed = v !== myName;
  myName = v; saveIdentity();
  if (noticeKey==="nNoName") setNotice(null);
  if (ENDPOINT){ setEnabled(true); if (statusKey==="ro"||statusKey==="connecting") setStatus("ready"); }
  applyLang();
  if (changed && Object.keys(clean()).length) schedule(200);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-uilang]");
  if (lb){ lang = lb.dataset.uilang; try{ localStorage.setItem("polar-vote-lang", lang); }catch(_){} applyLang(); return; }
  const sb = e.target.closest(".seg button");
  if (sb && canVote){
    const mid = sb.dataset.m, d = sb.dataset.d, v = sb.dataset.v==="?" ? "?" : Number(sb.dataset.v);
    const cur = mine[mid] || (mine[mid] = {});
    cur[d] = (cur[d]===v) ? null : v;
    refresh(); schedule(500); return;
  }
  const fb = e.target.closest("#flang button");
  if (fb){ langFilter = fb.dataset.f; document.querySelectorAll("#flang button").forEach(b=>b.setAttribute("aria-pressed", String(b===fb))); applyFilters(); return; }
  const th = e.target.closest("th[data-sort]");
  if (th){ const k = th.dataset.sort; if (sortKey===k) sortDir = sortDir==="asc"?"desc":"asc"; else { sortKey=k; sortDir = (k==="pol"||k==="op"||k==="n")?"desc":"asc"; } renderResults(); return; }
  const tr = e.target.closest("tr.clk"); if (tr){ openMarker(tr.dataset.m); return; }
  const c = e.target.closest("circle[data-m]"); if (c){ openMarker(c.dataset.m); return; }
});
document.addEventListener("keydown", e => {
  const c = e.target.closest && e.target.closest("circle[data-m]");
  if (c && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openMarker(c.dataset.m); }
});
$("#plot").addEventListener("mouseover", e => {
  const c = e.target.closest("circle[data-m]"); if(!c) return;
  const m = MBYID[c.dataset.m], list = ratingsFor(m.id), L = t(), p = stat(list,"pol"), o = stat(list,"op");
  $("#cap").textContent = `${m.cl.id} · ${m.lang} · ${m.tx} — ${L.pol} ${p.mean.toFixed(2)}, ${L.op} ${o.mean.toFixed(2)} (n=${Math.min(p.n,o.n)}–${Math.max(p.n,o.n)})`;
});
document.addEventListener("input", e => {
  const inp = e.target.closest(".cm input");
  if (inp && canVote){ const cur = mine[inp.dataset.m] || (mine[inp.dataset.m] = {}); cur.c = inp.value; schedule(1200); }
});
document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest(".cm input") && dirty){ clearTimeout(saveTimer); flush(); refresh(); } });
$("#funrated").addEventListener("change", e => { onlyUnrated = e.target.checked; applyFilters(); });
$("#v-vote").addEventListener("click", ()=>showView("vote"));
$("#v-res").addEventListener("click", ()=>showView("res"));

/* ---------- boot ---------- */
$("#name-ok").addEventListener("click", submitName);
$("#voter-name").addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); submitName(); } });
buildClusters();
setEnabled(false);
loadIdentity();
let restored = false;
try {
  const b = JSON.parse(localStorage.getItem(BACKUP_KEY) || "null");
  if (b && b.voter===me && b.pending && b.mine){ mine = b.mine; touched = true; gotMine = true; restored = true; }
} catch(e){}
$("#voter-name").value = myName;
applyLang();

if (!ENDPOINT){
  setStatus("nodb"); setNotice("nNoEndpoint");
} else {
  if (myName) setEnabled(true); else setNotice("nNoName");
  pull().then(() => { if (!myName && statusKey!=="error") setStatus("ro"); if (restored && myName) schedule(300); });
  setInterval(() => { if (!document.hidden && !saving && !dirty) pull(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !saving && !dirty) pull(); });
}
</script>
